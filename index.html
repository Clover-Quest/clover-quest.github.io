<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Clover Quest</title>
    <meta name="description" content="Privates Black-Clover-Fanprojekt: 2D-Action-RPG mit Grimoire-Magie" />
    <meta name="theme-color" content="#0f0c22" />
    <!-- iPhone/iPad: als Vollbild-App vom Home-Bildschirm starten -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clover Quest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0f0c22;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        /* Notch / Dynamic Island und Home-Leiste freilassen */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      canvas { image-rendering: pixelated; display: block; }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0f0c22;
        color: #f1ecff;
        font: 600 18px -apple-system, system-ui, sans-serif;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        text-align: center;
        padding: 24px;
      }
      #rotate .phone {
        width: 46px;
        height: 80px;
        border: 3px solid #e8c26a;
        border-radius: 9px;
        animation: turn 1.8s ease-in-out infinite;
      }
      @keyframes turn { 50% { transform: rotate(-90deg); } }
      #rotate small { font-weight: 400; font-size: 14px; color: #b7aed6; max-width: 300px; line-height: 1.4; }
      #rotate button {
        margin-top: 6px;
        font: 600 15px -apple-system, system-ui, sans-serif;
        color: #1d1505;
        background: #e8c26a;
        border: 0;
        border-radius: 8px;
        padding: 12px 18px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
        /* wer das Querformat nicht nutzen kann, spielt hochkant (kleiner) */
        .portrait-ok #rotate { display: none; }
      }
    </style>
    <script type="module" crossorigin src="./assets/main-Dt03vWMp.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/hageMap-BzqM7Zmf.js">
    <link rel="modulepreload" crossorigin href="./assets/phaser-0YPJO2g1.js">
    <link rel="modulepreload" crossorigin href="./assets/enemyBrain-DgGZrV4x.js">
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="phone"></div>
      Bitte dein Gerät ins Querformat drehen
      <small>Dreht sich nichts? Im Kontrollzentrum die Ausrichtungssperre ausschalten.</small>
      <button id="portrait-ok" type="button">Trotzdem hochkant spielen</button>
    </div>
    <script>
      document.getElementById('portrait-ok').addEventListener('click', () => document.documentElement.classList.add('portrait-ok'));
      // Die neue 3D-Fassung ist der Standard. Die 2D-Fassung bleibt erreichbar mit ?2d=1
      // (und wird für die Aufnahmeprüfung mit ?exam=1 geöffnet, bis es sie in 3D gibt).
      (function () {
        var p = new URLSearchParams(location.search);
        if (!p.has('2d') && !p.has('exam') && !p.has('grimoire')) location.replace('./3d/');
      })();
    </script>
  </body>
</html>
