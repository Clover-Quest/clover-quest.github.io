    <style>
      :root { --ink: #f6efe0; --panel: rgba(18, 14, 42, 0.62); --gold: #e8c26a; --deep: #120e2a; color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0f0c22; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      .hud { position: fixed; inset: 0; pointer-events: none; font: 500 14px -apple-system, system-ui, sans-serif; color: var(--ink); }
      .hud button { pointer-events: auto; font: 600 14px -apple-system, system-ui, sans-serif; color: var(--deep); background: var(--gold); border: 0; border-radius: 10px; padding: 9px 13px; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
      .hud button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
      .title { position: absolute; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); max-width: calc(100vw - 150px - env(safe-area-inset-left) - env(safe-area-inset-right)); background: var(--panel); padding: 8px 12px; border-radius: 10px; }
      .title b { color: var(--gold); }
      .hint { position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 44px); left: max(12px, env(safe-area-inset-left)); background: var(--panel); padding: 5px 10px; border-radius: 8px; font-size: 12px; opacity: .9; }
      .travel { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; width: min(96vw, 560px); }
      .travel button { background: var(--panel); color: var(--ink); border: 1px solid rgba(232,194,106,.6); padding: 7px 11px; font-size: 13px; }
      .side { position: absolute; right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
      .side #zin, .side #zout { width: 42px; padding: 7px 0; font-size: 18px; background: var(--panel); color: var(--ink); border: 1px solid rgba(232,194,106,.6); }
      #talk { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: calc(max(12px, env(safe-area-inset-bottom)) + 56px); padding: 16px 20px; font-size: 16px; border-radius: 40px; }
      #dlg { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(max(12px, env(safe-area-inset-bottom)) + 52px); width: min(92vw, 720px); background: rgba(18,14,42,.94); border: 2px solid var(--gold); border-radius: 12px; padding: 22px 18px 14px; box-sizing: border-box; pointer-events: auto; }
      #dlgName { position: absolute; top: -14px; left: 14px; padding: 3px 10px; border-radius: 6px; color: var(--deep); background: #7fe3ff; font-weight: 700; font-size: 13px; }
      #dlgText { font: 400 17px Georgia, serif; line-height: 1.45; }
      #dlgNext { text-align: right; color: var(--gold); font: 12px monospace; margin-top: 6px; }
      #stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(255,255,255,.1); }
      #knob { position: absolute; left: 31px; top: 31px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.4); }
      .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(24, 14, 44, 0.32) 100%); }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; color: var(--ink); font: 600 18px -apple-system, system-ui, sans-serif; background: radial-gradient(circle at 50% 40%, #2c2456, #0f0c22); }
      [hidden] { display: none !important; }
      @media (max-width: 520px) { .hint { display: none; } }
