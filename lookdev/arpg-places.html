    <style>
      :root { color-scheme: dark; --ink: #efe6d2; --panel: rgba(14, 12, 22, 0.72); --gold: #d9b45a; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e15; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #app { position: fixed; inset: 0; }

      .pick { position: fixed; right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: 80vw; }
      .pick button { font: 600 13px -apple-system, system-ui, sans-serif; color: var(--ink); background: var(--panel); border: 1px solid rgba(217, 180, 90, 0.6); border-radius: 8px; padding: 7px 9px; }
      .pick button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .pick button:active { background: rgba(217, 180, 90, 0.25); }
      body.nohud .hud, body.nohud .pick { display: none; }
